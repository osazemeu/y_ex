[package]
name = "yex"
version = "0.7.2"
authors = []
edition = "2021"

[lib]
name = "yex"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
flexbuffers = "25.0.0"
postcard = { version = "1", default-features = false, features = ["alloc"] }
rustler = "0.39.0"
scoped_thread_local = "1.0.0"
serde = "1.0.210"
serde_json = "1.0.120"
yrs = { version = "0.28.0", features=["sync", "weak"] }

[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
nif_version_2_17 = ["rustler/nif_version_2_17"]

# Rejects a client listed twice (in blocks or the delete set), a clock range
# past u32::MAX and a block that does not fit integrated content when decoding
# or applying an update (osazemeu/y-crdt legendary/decode-guards-0.28.2 on yrs
# v0.28.2). Drop this once an upstream yrs release rejects these shapes.
[patch.crates-io]
yrs = { git = "https://github.com/osazemeu/y-crdt", rev = "6bf51ad2065cb1164e483368d9e8de2bf75e7178" }
